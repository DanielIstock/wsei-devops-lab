name: CI - Optimized

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend - Restore, Build, Test, Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5/sample-ci/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore ProductApi/ProductApi.csproj
          dotnet restore ProductApi.Tests/ProductApi.Tests.csproj

      - name: Build (Backend + Tests)
        run: |
          dotnet build ProductApi/ProductApi.csproj --configuration Release --no-restore
          dotnet build ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test ProductApi.Tests/ProductApi.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger trx

      - name: Publish
        run: |
          dotnet publish ProductApi/ProductApi.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ProductApi/publish

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: lab5/sample-ci/backend/ProductApi/publish

  frontend:
    name: Frontend - Install, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5/sample-ci/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: lab5/sample-ci/frontend/dist
